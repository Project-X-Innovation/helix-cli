name: Skill surface sync check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  skill-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci
        # prepare script runs build automatically after npm ci

      - run: node scripts/skill-sync/check-coverage.mjs
